name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: Publish verified artifact
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-production:
    name: Verify published site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages and verify the application shell
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          site_root="${SITE_URL%/}/"
          for attempt in {1..12}; do
            page="$(curl --fail --silent --show-error --location "$site_root" 2>/dev/null)" \
              && grep --quiet --ignore-case 'Cardcraft' <<<"$page" \
              && curl --fail --silent --show-error --location --output /dev/null "${site_root}editor/" \
              && exit 0
            echo "Published site is not ready yet (attempt $attempt/12)"
            sleep 5
          done
          echo "GitHub Pages did not pass the post-deploy smoke check"
          exit 1
